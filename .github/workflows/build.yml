name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run setup
      - name: Install build dependencies and test Python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            PYTHON=.venv/Scripts/python.exe
          else
            PYTHON=.venv/bin/python
          fi
          "$PYTHON" -m pip install -r backend/requirements-dev.txt
          "$PYTHON" -m pytest -q
      - run: npm test
      - run: npm run test:ui
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Shopot-${{ runner.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: node scripts/checksum-release.cjs artifacts
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --draft --title "Shopot $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --draft=false
